name: Build Site App

run-name: "Site app: ${{ inputs.site_url }}"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Website URL (https://...). Several, comma separated, build a hub: Claude=https://claude.ai, ChatGPT=https://chatgpt.com"
        required: true
        type: string
      app_name:
        description: Name under the home-screen icon (empty = site host, or "AI Hub" for a hub)
        required: false
        default: ''
        type: string
      bundle_id:
        description: Bundle ID (empty = derived from the host, e.g. site.com.example, or from the hub name)
        required: false
        default: ''
        type: string
      allowed_hosts:
        description: Extra hosts that stay inside the app, comma separated (e.g. login/payment domains)
        required: false
        default: ''
        type: string
      external_links_in_safari:
        description: Open links to other websites in Safari
        required: false
        default: true
        type: boolean
      icon_url:
        description: Icon image URL (empty = the site's apple-touch-icon)
        required: false
        default: ''
        type: string

permissions:
  contents: write  # publishes the prebuilt engine as a release asset

concurrency:
  group: site-app-${{ inputs.app_name }}-${{ inputs.site_url }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TrollStore .tipa
    runs-on: macos-26
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: standard
      GECKO_CACHE_DIR: ${{ github.workspace }}/gecko-cache
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Resolve app identity
        id: identity
        env:
          SITE_URL: ${{ inputs.site_url }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -eu
          SITES="$(printf '%s' "$SITE_URL" | tr '\n;' ',,')"
          SITE_COUNT="$(printf '%s\n' "$SITES" | tr ',' '\n' | grep -c '[^[:space:]]' || true)"
          slug() { printf '%s' "$1" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9.-]+/-/g; s/^-+//; s/-+$//'; }

          if [ "$SITE_COUNT" -gt 1 ]; then
            # Hub: identity comes from the app name
            APP_NAME="${APP_NAME:-AI Hub}"
            NAME_SLUG="$(slug "$APP_NAME")"
            if [ -z "$NAME_SLUG" ]; then NAME_SLUG="hub"; fi
            if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID="site.hub.$NAME_SLUG"; fi
            OUTPUT_BASENAME="$NAME_SLUG"
          else
            ENTRY="$(printf '%s' "$SITES" | tr -d ',' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            URL="$(printf '%s' "$ENTRY" | sed -E 's#^[^=/?]*=[[:space:]]*##')"
            case "$URL" in
              http://*|https://*) ;;
              *) URL="https://$URL" ;;
            esac
            HOST="$(printf '%s' "$URL" | sed -E 's#^[a-zA-Z]+://##; s#[/?#].*$##; s#:.*$##' | tr 'A-Z' 'a-z')"
            SHORT_HOST="${HOST#www.}"
            if [ -z "$BUNDLE_ID" ]; then
              REVERSED="$(printf '%s' "$SHORT_HOST" | awk -F. '{for (i=NF; i>0; i--) printf "%s%s", $i, (i>1 ? "." : "")}')"
              BUNDLE_ID="site.$(printf '%s' "$REVERSED" | sed -E 's/[^a-z0-9.-]/-/g')"
            fi
            APP_NAME="${APP_NAME:-$SHORT_HOST}"
            OUTPUT_BASENAME="$(slug "$SHORT_HOST")"
          fi
          {
            echo "sites=$SITES"
            echo "app_name=$APP_NAME"
            echo "bundle_id=$BUNDLE_ID"
            echo "output_basename=$OUTPUT_BASENAME"
          } >> "$GITHUB_OUTPUT"
          echo "Sites: $SITES"
          echo "Name: $APP_NAME"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Output: $OUTPUT_BASENAME-TrollStore.tipa"

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Restore prebuilt Gecko
        id: gecko-cache
        uses: actions/cache/restore@v4
        with:
          path: gecko-cache
          key: gecko-dist-${{ hashFiles('engine/release.txt', 'patches/**', 'tools/development/build-gecko.sh', 'tools/development/apply-patches.sh', 'tools/development/update-gecko.sh') }}

      # The Actions cache is evicted after a week without use; the same engine is
      # also kept as a release asset (engine-<hash>), which never expires.
      - name: Find prebuilt Gecko
        id: engine
        env:
          CACHE_HIT: ${{ steps.gecko-cache.outputs.cache-hit }}
          ENGINE_KEY: ${{ hashFiles('engine/release.txt', 'patches/**', 'tools/development/build-gecko.sh', 'tools/development/apply-patches.sh', 'tools/development/update-gecko.sh') }}
        run: |
          TAG="engine-$(printf '%s' "$ENGINE_KEY" | cut -c1-16)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "source=cache" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p gecko-cache.tar.gz -D "$RUNNER_TEMP" 2>/dev/null; then
            mkdir -p "$GECKO_CACHE_DIR"
            tar -xzf "$RUNNER_TEMP/gecko-cache.tar.gz" -C "$GECKO_CACHE_DIR"
            rm -f "$RUNNER_TEMP/gecko-cache.tar.gz"
            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "Prebuilt Gecko restored from release $TAG"
          else
            echo "source=build" >> "$GITHUB_OUTPUT"
            echo "No prebuilt Gecko for $TAG; building it"
          fi

      # ---------- Full Gecko build (only when the cache above missed) ----------

      - name: Install build dependencies
        if: steps.engine.outputs.source == 'build'
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Fetch and patch Gecko source
        if: steps.engine.outputs.source == 'build'
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 engine/firefox
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        if: steps.engine.outputs.source == 'build'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-standard-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            buildcache-gecko-deps-standard-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        if: steps.engine.outputs.source == 'build'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko
        if: steps.engine.outputs.source == 'build'
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
          MOZ_NOSPAM: "1"
        run: ./tools/development/build-gecko.sh --use-sccache --auto-clobber

      - name: Package Gecko for reuse
        if: steps.engine.outputs.source == 'build'
        run: |
          set -eu
          rm -rf "$GECKO_CACHE_DIR"
          mkdir -p "$GECKO_CACHE_DIR"
          # Dereference symlinks so the cache works without the Gecko source/objdir
          rsync -rtL --exclude 'Test*' --exclude 'test_*' --exclude '*_unittest' \
            engine/firefox/obj-aarch64-apple-ios/dist/ "$GECKO_CACHE_DIR/dist/" || [ $? -eq 23 ]
          rsync -rtL engine/firefox/toolkit/mozapps/extensions/default-theme/ "$GECKO_CACHE_DIR/default-theme/"
          du -sh "$GECKO_CACHE_DIR"

      - name: Save prebuilt Gecko
        if: steps.engine.outputs.source == 'build'
        uses: actions/cache/save@v4
        with:
          path: gecko-cache
          key: ${{ steps.gecko-cache.outputs.cache-primary-key }}

      - name: Publish prebuilt Gecko to release
        continue-on-error: true
        env:
          TAG: ${{ steps.engine.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already has the engine"
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/gecko-cache.tar.gz" -C "$GECKO_CACHE_DIR" .
          ls -lh "$RUNNER_TEMP/gecko-cache.tar.gz"
          gh release create "$TAG" "$RUNNER_TEMP/gecko-cache.tar.gz" \
            -R "$GITHUB_REPOSITORY" \
            --title "Prebuilt Gecko ($TAG)" \
            --notes "Gecko build output (dist + default theme) used by the Build Site App workflow, so app builds can skip the multi-hour engine build." \
            --prerelease
          rm -f "$RUNNER_TEMP/gecko-cache.tar.gz"

      # ---------- App build ----------

      - name: Use prebuilt Gecko
        if: steps.engine.outputs.source != 'build'
        run: |
          set -eu
          mkdir -p engine/firefox/obj-aarch64-apple-ios engine/firefox/toolkit/mozapps/extensions
          rm -rf engine/firefox/obj-aarch64-apple-ios/dist engine/firefox/toolkit/mozapps/extensions/default-theme
          ln -s "$GECKO_CACHE_DIR/dist" engine/firefox/obj-aarch64-apple-ios/dist
          ln -s "$GECKO_CACHE_DIR/default-theme" engine/firefox/toolkit/mozapps/extensions/default-theme

      - name: Check out idevice source
        run: git submodule update --init --recursive support/idevice

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: |
          brew install ldid
          python3 -m pip install --break-system-packages --quiet pillow || python3 -m pip install --quiet pillow

      - name: Set app icon
        env:
          SITES: ${{ steps.identity.outputs.sites }}
          ICON_URL: ${{ inputs.icon_url }}
        run: python3 tools/site/set-icon.py --sites "$SITES" --icon "$ICON_URL" --export "$RUNNER_TEMP/site-icons"

      - name: Build app
        run: |
          set -o pipefail
          ./tools/release/build-app.sh --no-signing 2>&1 | tee build-app.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build-app.log ]; then
            echo "::group::Errors"
            grep -n -E "error:|\*\* (ARCHIVE|BUILD) FAILED|The following build commands failed|PhaseScriptExecution" -A4 build-app.log | grep -v "nullability" | head -300 || true
            echo "::endgroup::"
            echo "::group::Last 150 lines"
            tail -150 build-app.log
            echo "::endgroup::"
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-app.log
          path: build-app.log
          if-no-files-found: ignore

      - name: Create TrollStore TIPA
        env:
          REYNARD_SITES: ${{ steps.identity.outputs.sites }}
          REYNARD_SITE_NAME: ${{ steps.identity.outputs.app_name }}
          REYNARD_SITE_ICONS_DIR: ${{ runner.temp }}/site-icons
          REYNARD_SITE_ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
          REYNARD_SITE_EXTERNAL_LINKS: ${{ inputs.external_links_in_safari }}
          REYNARD_BUNDLE_ID: ${{ steps.identity.outputs.bundle_id }}
          REYNARD_OUTPUT_BASENAME: ${{ steps.identity.outputs.output_basename }}
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Inspect package
        env:
          OUTPUT_BASENAME: ${{ steps.identity.outputs.output_basename }}
        run: |
          set -eu
          TIPA="dist/$OUTPUT_BASENAME-TrollStore.tipa"
          ls -lh "$TIPA"
          rm -rf dist/inspect && mkdir -p dist/inspect && cd dist/inspect
          unzip -q "../$OUTPUT_BASENAME-TrollStore.tipa"
          APP=Payload/Reynard.app
          plutil -p "$APP/Info.plist" | grep -E 'CFBundle(Identifier|DisplayName|Name)|ReynardSite'
          plutil -p "$APP/PlugIns/Reynard Helper.appex/Info.plist" | grep CFBundleIdentifier
          ls "$APP/PlugIns"
          test -x "$APP/ts_ptrace_jit"
          grep -E '"(id|version)"' "$APP/Frameworks/GeckoView.framework/Frameworks/extensions/readerview/manifest.json" || true
          ls "$APP/SiteIcons" || true
          ldid -e "$APP/Reynard" | grep -A1 application-identifier
          ldid -e "$APP/PlugIns/Reynard Helper.appex/Reynard Helper" | grep -A1 application-identifier

      - name: Upload TrollStore TIPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.output_basename }}-TrollStore.tipa
          path: dist/${{ steps.identity.outputs.output_basename }}-TrollStore.tipa
          if-no-files-found: error

      # Stable download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/app-<host>/<host>-TrollStore.tipa
      - name: Publish TIPA to release
        env:
          OUTPUT_BASENAME: ${{ steps.identity.outputs.output_basename }}
          APP_NAME: ${{ steps.identity.outputs.app_name }}
          SITE_URL: ${{ steps.identity.outputs.sites }}
        run: |
          TAG="app-$OUTPUT_BASENAME"
          TIPA="dist/$OUTPUT_BASENAME-TrollStore.tipa"
          NOTES="$APP_NAME ($SITE_URL) for TrollStore. Built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TIPA" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" "$TIPA" -R "$GITHUB_REPOSITORY" --title "$APP_NAME for TrollStore" --notes "$NOTES"
          fi
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$OUTPUT_BASENAME-TrollStore.tipa"
